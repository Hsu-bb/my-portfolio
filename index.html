            <a

              Home

              <span
                class="absolute bottom-1 left-1/2 h-1 w-12 -translate-x-1/2 rounded-full bg-gradient-to-r from-fuchsia-500 via-purple-500 to-cyan-400"
              ></span>
            </a>

            <a
              href="/#about"
              class="rounded-full px-6 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950"

            >
              Blog
            </a>
          </div>

          <!-- Mobile Menu Button -->
          <button
            id="menu-button"
            type="button"
            class="rounded-full border border-slate-200 bg-white/80 px-5 py-3 text-sm font-semibold text-slate-950 shadow-md backdrop-blur-xl md:hidden"
            aria-label="Open navigation menu"
          >
            Menu
          </button>
        </nav>

        <!-- Mobile Navigation -->
        <div
          id="mobile-menu"
          class="mx-6 hidden overflow-hidden rounded-3xl border border-slate-200 bg-white/95 shadow-xl backdrop-blur-xl md:hidden"

          <div class="flex flex-col p-3">
            <a
